<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: http: https: gap: wss: 'unsafe-inline' 'unsafe-eval'; media-src * blob:; img-src 'self' data: blob: http: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; connect-src 'self' http: https: ws: wss:;" />
    <!-- Google tag (gtag.js) — GA4 (G-YFW2XSQK03). Loaded only on the ganime.io web domain,
         so native (Cordova app://) and localhost dev sessions don't pollute web analytics. -->
    <script>
      (function () {
        var h = location.hostname
        if (h !== 'ganime.io' && h !== 'www.ganime.io') return
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-YFW2XSQK03'
        document.head.appendChild(s)
        window.dataLayer = window.dataLayer || []
        function gtag() { dataLayer.push(arguments) }
        window.gtag = gtag
        gtag('js', new Date())
        gtag('config', 'G-YFW2XSQK03')
      })()
    </script>
    <title>%VITE_APP_DISPLAY_NAME%</title>
    <!-- Default Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_APP_DISPLAY_NAME%" />
    <meta property="og:description" content="Watch anime series on %VITE_APP_DISPLAY_NAME%" />
    <meta property="og:image" content="" />
    <meta property="og:site_name" content="%VITE_APP_DISPLAY_NAME%" />
    <!-- Default Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_APP_DISPLAY_NAME%" />
    <meta name="twitter:description" content="Watch anime series on %VITE_APP_DISPLAY_NAME%" />
    <meta name="twitter:image" content="" />
    <!-- Player.js for Bunny Stream Playback Control API -->
    <script src="https://assets.mediadelivery.net/playerjs/player-0.1.0.min.js"></script>
    <!-- Cordova.js - only loaded when running in Cordova -->
    <script src="cordova.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
