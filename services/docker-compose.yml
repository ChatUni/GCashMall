# Runs the long-running services on the EC2 instance.
#
# One service per entry. Adding another moved-off-serverless service later means another
# block here plus its name in the worker's HANDLED map (or its own image) — the queue,
# dispatch and callback plumbing is already shared.
services:
  moderation-worker:
    build:
      context: ..
      dockerfile: services/moderation-worker/Dockerfile
    image: ganime/moderation-worker:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Where to call back to. Everything else the pipeline needs (Mongo, OpenAI, Bunny)
      # comes from the env file below.
      API_URL: ${API_URL}
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-15000}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      NODE_ENV: production
    env_file:
      - ./worker.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
