# Runs the long-running services on the EC2 instance.
#
# One service per entry. Adding another moved-off-serverless service later means another
# block here plus its name in the worker's HANDLED map (or its own image) — the queue,
# dispatch and callback plumbing is already shared.
services:
  moderation-worker:
    build:
      context: ..
      dockerfile: services/moderation-worker/Dockerfile
    image: ganime/moderation-worker:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Every value comes from worker.env. Do NOT add an `environment:` block with ${VAR}
    # interpolation: those resolve from the shell, not from env_file, and `environment:`
    # overrides `env_file` — so an unset shell var silently blanks a value that worker.env
    # had set correctly. API_URL and WORKER_SHARED_SECRET were both blanked this way.
    env_file:
      - ./worker.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
