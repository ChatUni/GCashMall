[build]
  functions = "netlify/functions"
  publish = "www"
  edge_functions = "netlify/edge-functions"

[functions]
  # glin-profanity is a dual ESM/CJS package; the tracer only ships the import
  # entry, but the runtime resolves the require entry (index.cjs). Force-include
  # the whole package so both resolve.
  included_files = ["node_modules/glin-profanity/**"]

# The audio/composition function shells out to the ffmpeg-static binary. Bundling it
# with esbuild breaks its __dirname-based binary path, so keep it external and ship
# the whole package (binary included) with the function.
[functions."pipeline-audio-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/**"]

# The video function now also uses ffmpeg (extracting each shot's last frame to seed
# the next shot for frame-chained continuity), so it needs the same external binary.
[functions."pipeline-video-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/**"]

# The cover-backfill function extracts a cover frame per shot with ffmpeg too.
[functions."pipeline-covers-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/**"]

# The random-frame picker extracts frames from the episode video with ffmpeg.
[functions."pipeline-random-frames-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/**"]

# The subtitle-backfill function extracts audio from the episode (via ffmpeg) to transcribe.
[functions."pipeline-transcribe-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/**"]

# The upload-moderation function extracts audio + frames from the video with ffmpeg.
[functions."moderate-upload-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/**"]

[dev]
  port = 8888
  framework = "#custom"
  command = "npm run dev:vite"
  targetPort = 5173

# Edge function for injecting OG meta tags on player pages (social bots only)
[[edge_functions]]
  function = "og-meta"
  path = "/player/*"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Old privacy-policy URLs (the App Store and Google Play listings link privacy.html).
# force = true so the redirect wins over any file left at that path.
[[redirects]]
  from = "/privacy.html"
  to = "/privacy-policy.html"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms-of-service.html"
  status = 301

# SPA fallback - must come last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200